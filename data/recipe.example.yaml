# Рецепт сборки. Пара «этот файл + снапшоты источников» однозначно определяет
# выход. Версия curated называется по хешу рецепта.
#
# Задача — мультилейбл-классификация помех, схема меток в taxonomy.yaml.

name: occlusionnet
version: v1

sources: [evocargo_raindrops, acdc, glare, dark_zurich, dawn, bdd100k, sid]

# --- целевой кадр ------------------------------------------------------------
target:
  # Классификация помехи не требует исходного разрешения: капли, блики и туман
  # различимы и на 512 по короткой стороне. Это на порядок дешевле по объёму и
  # по времени обучения. Единственное исключение — blur_motion: смаз при сильном
  # уменьшении частично «зашивается», поэтому порог по резкости считается
  # ДО ресайза, на стадии land, и едет в манифесте как признак.
  short_side: 512
  on_smaller: keep_flagged   # апскейла нет, мелкие кадры помечаются
  fit: crop_center
  format: jpeg
  quality: 90
  color: srgb8

# --- прореживание ------------------------------------------------------------
sampling:
  # SID и Dark Zurich — видео. Соседние кадры почти идентичны и раздувают
  # доминирующие классы, не добавляя информации.
  frame_rate_hz: 2
  dedup:
    phash_hamming: 4          # ищется по объединённому манифесту, не внутри источника
  stereo:
    keep: left_only           # для классификации вторая камера бесполезна

# --- отбор -------------------------------------------------------------------
select:
  where: "error is null and width >= 640"

# --- баланс ------------------------------------------------------------------
balance:
  # Главный риск постановки: половина классов приходит из одного источника
  # целиком. GLARE весь состоит из flare_sun, ACDC/fog весь из тумана. Модель
  # тогда учится узнавать датасет, а не помеху, и на чужих кадрах разваливается.
  by: [source, label]
  max_per_group: 15000
  min_sources_per_label: 2    # метка с единственным источником не идёт в test
  # Метки без второго источника на сегодня: raindrops, soiling.
  # Либо добирать синтетикой, либо честно держать их только в train.

# --- сплиты ------------------------------------------------------------------
splits:
  by: sequence_id             # только по сиквенсам, никогда по кадрам
  stratify_by: [label, source]
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 20260815
  # Кадры синтетического происхождения в val и test не допускаются:
  # иначе меряется качество генератора, а не модели.
  exclude_synthetic_from: [val, test]

# --- выход -------------------------------------------------------------------
output:
  layout: webdataset
  shard_bytes: 512MiB         # при 512px шарды мельче, иначе их будет три штуки
  bucket: "${bucket}-datasets"
  prefix: curated/occlusionnet/v1
  register_in_clearml: true
