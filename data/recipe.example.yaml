# Рецепт сборки. Пара «этот файл + снапшоты источников» однозначно определяет
# выход. Версия curated называется по хешу рецепта.
#
# Задача — мультилейбл-классификация помех, схема меток в taxonomy.yaml.

name: occlusionnet
version: v1

sources: [evocargo_raindrops, acdc, glare, dark_zurich, dawn, bdd100k, sid]

# --- целевой кадр ------------------------------------------------------------
# Ключи здесь читает data/build.py напрямую, менять имена нельзя.
target:
  # Квадрат: одна геометрия для всех источников. Разрешение как признак
  # источника после этого исчезает — а оно у нас предсказывало метку в 87%
  # случаев. Классификации помех исходное разрешение не нужно: капли, блики и
  # туман различимы и на 512.
  size: 512

  # crop_center режет по короткой стороне, геометрия не искажается, но у 16:9
  # уходит 44% ширины. Альтернатива stretch сохраняет всё поле зрения ценой
  # искажения. Дополнение полями намеренно не поддержано: толщина полос
  # закодировала бы исходное соотношение сторон, то есть вернула бы ровно тот
  # признак источника, который мы убираем.
  fit: crop_center

  # Один кодек и одно качество для всех. Убирает ещё один признак источника:
  # у Evocargo кадры 1920x1080 весили 0.27 МБ против 1.5 МБ у 1280x1024, и по
  # весу файла съёмки различались, не глядя на содержимое.
  format: jpeg
  quality: 90

  # Приведение резкости к самому мягкому источнику. Считается по выборке:
  # для каждого источника подбирается своё размытие, одно на источник, чтобы
  # обработка была воспроизводимой.
  #
  # ВНИМАНИЕ: необратимо огрубляет данные. Если в датасете появится класс
  # blur_motion, выравнивание уничтожит именно тот сигнал, который нужно
  # распознавать. Тогда это выключить, а различие в резкости между источниками
  # компенсировать балансировкой.
  equalize_sharpness: true
  calibration_frames: 24

# --- прореживание ------------------------------------------------------------
sampling:
  # Съёмки — видео, соседние кадры почти идентичны и раздувают доминирующие
  # классы, не добавляя информации. Шаг, а не частота в герцах: временных
  # меток в манифесте нет, выводить их из имён файлов — гадание.
  every_nth: 1
  dedup:
    exact_phash: true         # точные совпадения хеша, по всему датасету сразу

# --- отбор -------------------------------------------------------------------
select:
  # синтаксис pandas.query; битые кадры отсеяны раньше по полю error
  where: "width >= 640"

# --- баланс ------------------------------------------------------------------
balance:
  # Главный риск постановки: половина классов приходит из одного источника
  # целиком. GLARE весь состоит из flare_sun, ACDC/fog весь из тумана. Модель
  # тогда учится узнавать датасет, а не помеху, и на чужих кадрах разваливается.
  by: [source, label]
  max_per_group: 15000
  min_sources_per_label: 2    # метка с единственным источником не идёт в test
  # Метки без второго источника на сегодня: raindrops, soiling.
  # Либо добирать синтетикой, либо честно держать их только в train.

# --- сплиты ------------------------------------------------------------------
splits:
  by: sequence_id             # только по сиквенсам, никогда по кадрам
  stratify_by: [label, source]
  ratios: { train: 0.70, val: 0.15, test: 0.15 }
  seed: 20260815
  # Кадры синтетического происхождения в val и test не допускаются:
  # иначе меряется качество генератора, а не модели.
  exclude_synthetic_from: [val, test]

# --- выход -------------------------------------------------------------------
output:
  layout: webdataset          # в шарде пары <uid>.jpg и <uid>.json с метками
  shard_bytes_mb: 512
  bucket: "${bucket}-datasets"
  prefix: curated/occlusionnet/v1
  register_in_clearml: true
