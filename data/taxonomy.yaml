# Схема меток. Мультилейбл: на одном кадре может стоять сколько угодно меток
# одновременно — ночь, дождь, капли на стекле и блики от фар это норма, а не
# взаимоисключающие классы.
#
# clean не метка, а производная: ни одна метка из optics и scene не поднята.
# Отдельным классом его делать нельзя — иначе кадр «ночь, но больше ничего»
# оказывается одновременно clean и не clean.

version: 1

labels:

  # Помеха в оптическом тракте: на стекле, на линзе, в самой камере.
  # Существует независимо от того, что происходит в сцене.
  optics:
    raindrops:    капли воды на стекле или линзе
    soiling:      непрозрачная грязь, пыль, соль, налёт
    debris:       прилипший мусор — листья, насекомые, плёнка, пакет
    reflection:   отражение приборной панели и салона в лобовом стекле
    flare_sun:    засвет, ореолы и блуминг от солнца
    flare_light:  засвет от фар, фонарей, светофоров, вывесок
    blur_motion:  смаз от движения или длинной выдержки

  # Состояние среды. Ухудшает видимость, но помеха не на оптике.
  scene:
    fog:          туман, дымка, взвесь
    snowfall:     снег в воздухе перед камерой
    rainfall:     дождь в воздухе перед камерой
    night:        тёмное время суток
    dusk:         сумерки и рассвет

# ---------------------------------------------------------------------------
# Почему две группы, а не один плоский список
#
# Капли на стекле и дождь в кадре — разные явления, и путать их нельзя.
# Ночная съёмка в сухую погоду даёт flare_light без единой капли; мойка машины
# даёт капли при ясном небе. Снег на земле — вообще не окклюзия, а снег в
# воздухе перед объективом — окклюзия.
#
# Модель, обученная на смешанной таксономии, выучит корреляцию «дождь в
# метаданных → капли на стекле», которая верна в датасете и неверна в жизни.
# Разделение по группам позволяет это хотя бы измерить.
# ---------------------------------------------------------------------------

# Метки, для которых нет ни одного размеченного публичного источника.
# Собираются синтезом, но валидация обязана быть на реальных кадрах — иначе
# измеряется качество генератора, а не модели.
synthetic_only: [debris, reflection]

# Метки, которые добываются из метрик манифеста, а не из разметки источника.
derived:
  blur_motion:
    from: sharpness
    note: >-
      Порог по дисперсии лапласиана. Считать обязательно на кадре,
      приведённом к одной высоте: метрика зависит от разрешения, и без
      нормировки 720p и 1080p окажутся в разных классах ни за что.
